[package]
name = "sorocharge-mpp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "MPP draft-stellar-charge-00 wire-format adapter for sorocharge-signer: prepare/sign/send as a client, verify/submit/poll as a server"
keywords = ["mpp", "stellar", "soroban", "payments", "protocol"]
categories = ["web-programming", "network-programming", "finance", "authentication"]

[dependencies]
sorocharge-signer = { path = "../sorocharge-signer" }
stellar-xdr = { workspace = true }
stellar-rpc-client = { workspace = true }
reqwest = { workspace = true }
base64 = { workspace = true }
serde_jcs = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

tokio = { workspace = true }

[features]
# Exposes the internal `TransactionEnvelope` parser on a public path so the
# out-of-workspace `fuzz/` cargo-fuzz target can call it. Never enabled by a
# normal dependent, so the crate's public API is unchanged for real consumers.
fuzzing = []

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
ed25519-dalek = { workspace = true }
stellar-strkey = { workspace = true }
axum = { workspace = true }
