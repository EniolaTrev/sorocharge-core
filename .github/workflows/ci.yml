name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly at 03:17 UTC — off the top of the hour to avoid the CI rush.
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt check
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Run cargo-deny
        run: cargo deny check

  golden-vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.98.1
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install golden-vector generator deps
        working-directory: tests/golden_vectors
        run: npm ci

      - name: Lint golden-vector generator
        working-directory: tests/golden_vectors
        run: npm run lint

      - name: Check golden-vector formatting
        working-directory: tests/golden_vectors
        run: npm run format:check

      - name: Generate golden vectors
        working-directory: tests/golden_vectors
        run: node generate.mjs

      - name: Diff generated fixtures against committed fixtures
        run: git diff --exit-code -- tests/golden_vectors/fixtures

      - name: Run golden-vector tests
        run: cargo test --workspace -- golden_vector

  fuzz:
    # Fuzzing needs nightly Rust and a long time budget, so it runs on the
    # nightly schedule (or a manual dispatch) instead of blocking every PR.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - crate: sorocharge-signer
            target: verify_entry
          - crate: sorocharge-x402
            target: parse_payment_transaction
          - crate: sorocharge-mpp
            target: parse_payment_transaction
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/${{ matrix.crate }}/fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Fuzz ${{ matrix.crate }}::${{ matrix.target }}
        # Run from inside `fuzz/` so its `rust-toolchain.toml` (nightly) is
        # honored even if the runner's default toolchain is stable.
        working-directory: crates/${{ matrix.crate }}/fuzz
        # Bounded per-target budget; a crash fails the job.
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=300 -rss_limit_mb=4096
