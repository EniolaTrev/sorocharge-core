name: Bug report
description: Report a reproducible problem in sorocharge-core.
title: "bug: "
body:
  - type: markdown
    attributes:
      value: Please include enough detail to reproduce the problem.
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: Include the input, command, or code that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, operating system, and crate or feature versions.