[workspace]
resolver = "2"
members = [
    "crates/sorocharge-signer",
    "crates/sorocharge-x402",
    "crates/sorocharge-mpp",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.98.1"
license = "Apache-2.0"
repository = "https://github.com/sorocharge/sorocharge-core"

[workspace.dependencies]
stellar-xdr = { version = "=28.0.0", features = ["std", "serde", "base64"] }
stellar-strkey = { version = "=0.0.18" }
stellar-rpc-client = { version = "=28.0.0" }
ed25519-dalek = { version = "=3.0.0" }
getrandom = { version = "=0.4.3" }
sha2 = { version = "=0.11.0" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
base64 = { version = "=0.23.1" }
tokio = { version = "=1.53.1" }
serde_jcs = { version = "=0.2.0" }
axum = { version = "=0.8.9" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
